# Auslieferungskonfiguration fuer den Container zielsteuerfrei (nginx:alpine).
#
# Wird schreibgeschuetzt eingehaengt:
#   /data/websites/zielsteuerfrei-website/deploy/nginx.conf
#     -> /etc/nginx/conf.d/default.conf
#
# Dadurch liegt die Serverkonfiguration im Repository: Der Deploy-Cron holt
# Aenderungen mit dem restlichen Code, der anschliessende Container-Neustart
# uebernimmt sie.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Das Image liefert gzip deaktiviert aus, und der vorgelagerte Proxy
    # komprimiert nur text/html. JavaScript und CSS gingen dadurch
    # unkomprimiert an jeden Besucher.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml;

    # Vite schreibt Inhalts-Hashes in diese Dateinamen. Unter derselben URL
    # kann sich der Inhalt daher nie aendern.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Statische Dateien muessen mit 404 antworten, wenn es sie nicht gibt.
    # Ohne diese Bloecke fallen sie auf die SPA-Regel zurueck und jedes
    # fehlende Bild liefert HTTP 200 mit HTML-Inhalt.
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location ~* \.(?:txt|xml|json|webmanifest|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Client-seitiges Routing: unbekannte Pfade rendert die Anwendung, die
    # dafuer eine eigene 404-Seite mit noindex ausliefert.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html verweist auf gehashte Assets und darf deshalb nicht im
    # Browser-Cache festhaengen.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
